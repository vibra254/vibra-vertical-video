name: VIBRA build check

on:
  pull_request:
    branches: [main]
  push:
    branches: [firebase-production-foundation]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install dependencies
        run: bun install
      - name: Run regression tests
        run: bun run test
      - name: Build application
        run: bun run build
