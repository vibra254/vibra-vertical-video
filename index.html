<!DOCTYPE html>
<html lang="sw">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>VIBRA - Your Vibe. Your World.</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:system-ui}
body{background:#0a0a0a;color:#fff}
.top{display:flex;justify-content:space-between;padding:14px 16px;align-items:center;border-bottom:1px solid #222;position:sticky;top:0;background:#0a0a0a;z-index:10}
.logo{font-weight:900;font-size:22px;background:linear-gradient(90deg,#a855f7,#ec4899,#f97316);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.feed{max-width:480px;margin:0 auto;padding-bottom:80px}
.video-card{border-bottom:1px solid #222;padding-bottom:16px;margin-bottom:16px}
.video-card video{width:100%;border-radius:16px;background:#111;aspect-ratio:9/16;object-fit:cover}
.user-row{display:flex;align-items:center;gap:10px;padding:10px 12px}
.avatar{width:42px;height:42px;border-radius:50%;background:linear-gradient(135deg,#a855f7,#ec4899);display:flex;align-items:center;justify-content:center;font-weight:900}
.follow-btn{margin-left:auto;background:#fff;color:#000;border:0;padding:7px 16px;border-radius:20px;font-weight:700;cursor:pointer}
.follow-btn.following{background:#222;color:#fff}
.actions{display:flex;gap:18px;padding:10px 12px;font-size:22px}
.actions span{cursor:pointer}
.actions small{font-size:13px;display:block;color:#aaa}
.comments{padding:0 12px;color:#ccc;font-size:14px}
.lang-bar{display:flex;gap:8px;overflow:auto;padding:10px 12px}
.lang-bar button{background:#1a1a1a;color:#fff;border:1px solid #333;padding:6px 12px;border-radius:20px;cursor:pointer;white-space:nowrap}
.login{max-width:400px;margin:60px auto;padding:24px;text-align:center}
.login input{width:100%;padding:13px;margin:8px 0;border-radius:12px;border:1px solid #333;background:#111;color:#fff}
.password-wrap{position:relative;width:100%}.password-wrap input{padding-right:54px}
.eye-btn{position:absolute;right:8px;top:15px;height:38px;min-width:40px;border:0;border-radius:8px;background:#252525;color:#fff;font-size:18px;cursor:pointer}
.btn:disabled{opacity:.65;cursor:wait}
.btn{width:100%;padding:13px;border-radius:12px;border:0;font-weight:800;cursor:pointer;margin-top:8px}
.btn-google{background:#fff;color:#000}
.btn-email{background:linear-gradient(90deg,#a855f7,#ec4899,#f97316);color:#fff}
.bottom{position:fixed;bottom:0;left:0;right:0;background:#0a0a0a;border-top:1px solid #222;display:flex;justify-content:space-around;padding:12px 0;font-size:22px}
.profile{text-align:center;padding:20px}
.profile .avatar{width:90px;height:90px;font-size:32px;margin:0 auto}
.stats{display:flex;justify-content:center;gap:30px;margin:14px 0}
.stats b{display:block;font-size:18px}
.hidden{display:none}
</style>
</head>
<body>

<div id="loginPage" class="login">
  <div style="font-size:50px">🌍</div>
  <h1 class="logo" style="font-size:36px">VIBRA</h1>
  <p style="color:#aaa;margin:10px 0">Your Vibe. Your World. 🌍<br>Create • Share • Vibe</p>
  <button class="btn btn-google" onclick="loginGoogle()">G Continue with Google</button>
  <p style="margin:12px 0;color:#666">OR</p>
  <input id="email" placeholder="Email">
  <div class="password-wrap">
    <input id="password" type="password" placeholder="Password" autocomplete="current-password">
    <button type="button" id="togglePassword" class="eye-btn" onclick="togglePasswordVisibility()" aria-label="Onyesha password">👁️</button>
  </div>
  <p id="authMessage" style="font-size:12px;color:#fca5a5;margin:6px 0;min-height:18px"></p>
  <button class="btn btn-email" onclick="loginEmail()">Ingia / Jisajili</button>
  <div class="lang-bar" style="justify-content:center">
    <button onclick="setLang('sw')">🇰🇪 Kiswahili</button>
    <button onclick="setLang('en')">🇺🇸 English</button>
    <button onclick="setLang('fr')">🇫🇷 Français</button>
    <button onclick="setLang('es')">🇪🇸 Español</button>
    <button onclick="setLang('pt')">🇧🇷 Português</button>
    <button onclick="setLang('ar')">🇸🇦 العربية</button>
    <button onclick="setLang('hi')">🇮🇳 हिन्दी</button>
    <button onclick="setLang('zh')">🇨🇳 中文</button>
  </div>
</div>

<div id="app" class="hidden">
  <div class="top"><div class="logo">VIBRA</div><div>🌍 <span id="langLabel">SW</span></div></div>
  <div class="lang-bar" id="langBar"></div>
  <div id="profileBox" class="profile"></div>
  <div class="feed" id="feed"></div>
  <div style="max-width:480px;margin:0 auto;padding:0 16px">
    <h3 id="uploadTitle">Post Video Mpya</h3>
    <input id="videoUrl" placeholder="Weka link ya video (mp4)">
    <input id="caption" placeholder="Caption...">
    <button class="btn btn-email" onclick="postVideo()">Post - Dunia Nzima Ione</button>
  </div>
  <div class="bottom"><span onclick="showFeed()">🏠</span><span onclick="showProfile()">👤</span><span onclick="logout()">🚪</span></div>
</div>

<script>
const SUPABASE_URL = "https://wxqimmnubggkfzmiqdka.supabase.co";
const SUPABASE_KEY = "sb_publishable_dBA5ATYY-IxHw2EPyNVW5Q_Zet5GRcN";
const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

const LANGS = {
  sw:{home:"Nyumbani",follow:"Follow",following:"Unafuata",like:"Like",comment:"Comment",share:"Share",post:"Post"},
  en:{home:"Home",follow:"Follow",following:"Following",like:"Like",comment:"Comment",share:"Share",post:"Post"},
  fr:{home:"Accueil",follow:"Suivre",following:"Abonné",like:"J'aime",comment:"Commenter",share:"Partager",post:"Publier"},
  es:{home:"Inicio",follow:"Seguir",following:"Siguiendo",like:"Me gusta",comment:"Comentar",share:"Compartir",post:"Publicar"},
  pt:{home:"Início",follow:"Seguir",following:"Seguindo",like:"Curtir",comment:"Comentar",share:"Compartilhar",post:"Publicar"},
  ar:{home:"الرئيسية",follow:"متابعة",following:"تتابع",like:"إعجاب",comment:"تعليق",share:"مشاركة",post:"نشر"},
  hi:{home:"होम",follow:"फॉलो",following:"फॉलोइंग",like:"लाइक",comment:"कमेंट",share:"शेयर",post:"पोस्ट"},
  zh:{home:"首页",follow:"关注",following:"已关注",like:"点赞",comment:"评论",share:"分享",post:"发布"}
};
let currentLang = localStorage.getItem('vibra_lang') || 'sw';
let currentUser = null;

function togglePasswordVisibility(){
  const field=document.getElementById('password');
  const eye=document.getElementById('togglePassword');
  if(!field||!eye)return;
  const showing=field.type==='password';
  field.type=showing?'text':'password';
  eye.textContent=showing?'🙈':'👁️';
  eye.setAttribute('aria-label',showing?'Ficha password':'Onyesha password');
}
function authMessage(message,isError=true){
  const el=document.getElementById('authMessage');
  if(el){el.textContent=message||'';el.style.color=isError?'#fca5a5':'#86efac';}
}
function setLang(l){ currentLang=l; localStorage.setItem('vibra_lang',l); document.getElementById('langLabel').innerText=l.toUpperCase(); loadFeed(); renderLangBar(); }
function renderLangBar(){
  const flags={sw:'🇰🇪 SW',en:'🇺🇸 EN',fr:'🇫🇷 FR',es:'🇪🇸 ES',pt:'🇧🇷 PT',ar:'🇸🇦 AR',hi:'🇮🇳 HI',zh:'🇨🇳 ZH'};
  document.getElementById('langBar').innerHTML = Object.keys(flags).map(k=>`<button onclick="setLang('${k}')">${flags[k]}</button>`).join('');
}

async function loginGoogle(){
  authMessage('');
  try {
    const {error}=await supabase.auth.signInWithOAuth({
      provider:'google',
      options:{redirectTo:window.location.origin}
    });
    if(error) authMessage('Google Login: '+error.message);
  } catch(e) { authMessage('Google Login imeshindikana: '+(e.message||'Hakikisha Google provider imewashwa Supabase.')); }
}
async function loginEmail(){
  const email=document.getElementById('email').value.trim().toLowerCase();
  const password=document.getElementById('password').value;
  if(!email || !/^[^\\s@]+@[^\\s@]+\\.[^\\s@]+$/.test(email)) return alert('Weka email sahihi.');
  if(password.length<6){authMessage('Password iwe na angalau herufi/namba 6.');return;}
  authMessage('');
  const btn=document.querySelector('.btn-email');
  if(btn){btn.disabled=true;btn.textContent='Inasubiri...';}
  try {
    let {data,error}=await supabase.auth.signInWithPassword({email,password});
    if(error && /invalid login credentials/i.test(error.message)){
      const r=await supabase.auth.signUp({email,password,options:{data:{preferred_language:currentLang}}});
      if(r.error) throw r.error;
      data=r.data;
      if(!data.session){
        authMessage('Usajili umepokelewa. Fungua email yako uthibitishe akaunti, kisha urudi hapa uingie.',false);
        return;
      }
    } else if(error) throw error;
    if(!data.user) throw new Error('Akaunti haikupatikana. Jaribu tena.');
    const {error:profileError}=await supabase.from('profiles').upsert(
      {id:data.user.id,username:email.split('@')[0],language:currentLang},
      {onConflict:'id'}
    );
    if(profileError) console.warn('Profile haijahifadhiwa:',profileError.message);
    await checkUser();
  } catch(e) {
    authMessage('Imeshindikana: '+(e.message||'Jaribu tena.'));
  } finally {
    if(btn){btn.disabled=false;btn.textContent='Ingia / Jisajili';}
  }
}
async function checkUser(){
  const {data:{user}} = await supabase.auth.getUser();
  if(!user) return;
  currentUser=user;
  document.getElementById('loginPage').classList.add('hidden');
  document.getElementById('app').classList.remove('hidden');
  renderLangBar(); loadProfile(); loadFeed();
}
async function logout(){ await supabase.auth.signOut(); location.reload(); }

async function loadProfile(){
  let {data:profile} = await supabase.from('profiles').select('*').eq('id',currentUser.id).single();
  if(!profile){
    // Kama ni Mr Vibra - weka jina hili
    let uname = currentUser.email?.includes('hamad') ? 'Mr Vibra' : currentUser.email.split('@')[0];
    await supabase.from('profiles').insert({id:currentUser.id, username:uname});
    profile={username:uname};
  }
  let {count:followers} = await supabase.from('follows').select('*',{count:'exact',head:true}).eq('following_id',currentUser.id);
  let {count:following} = await supabase.from('follows').select('*',{count:'exact',head:true}).eq('follower_id',currentUser.id);
  let {data:vids} = await supabase.from('videos').select('likes_count').eq('user_id',currentUser.id);
  let totalLikes = (vids||[]).reduce((a,b)=>a+(b.likes_count||0),0);
  document.getElementById('profileBox').innerHTML = `
    <div class="avatar">${profile.username[0].toUpperCase()}</div>
    <h2>@${profile.username}</h2>
    <p style="color:#aaa">${profile.bio||'Your Vibe. Your World. 🌍 Create • Share • Vibe'}</p>
    <div class="stats"><div><b>${followers||0}</b>Followers</div><div><b>${following||0}</b>Following</div><div><b>${totalLikes}</b>Likes</div></div>
  `;
}
async function loadFeed(){
  let {data:videos} = await supabase.from('videos').select('*, profiles(username)').order('created_at',{ascending:false});
  let {data:likes} = currentUser ? await supabase.from('likes').select('video_id').eq('user_id',currentUser.id) : {data:[]};
  let likedIds = new Set((likes||[]).map(l=>l.video_id));
  let {data:comments} = await supabase.from('comments').select('*, profiles(username)').order('created_at',{ascending:false});
  document.getElementById('feed').innerHTML = (videos||[]).map(v=>{
    let vComments = (comments||[]).filter(c=>c.video_id===v.id).slice(0,3);
    return `<div class="video-card">
      <div class="user-row"><div class="avatar">${(v.profiles?.username||'V')[0].toUpperCase()}</div><b>@${v.profiles?.username||'vibra'}</b>
      <button class="follow-btn" onclick="followUser('${v.user_id}',this)">Follow</button></div>
      <video src="${v.video_url}" controls playsinline></video>
      <div class="actions">
        <span onclick="toggleLike('${v.id}',this)">${likedIds.has(v.id)?'❤️':'🤍'}<small>${v.likes_count} Likes</small></span>
        <span onclick="addComment('${v.id}')">💬<small>${vComments.length} Comments</small></span>
        <span onclick="shareVideo('${v.id}')">📤<small>Share</small></span>
      </div>
      <div class="comments"><b>@${v.profiles?.username}</b> ${v.caption||''}<br>${vComments.map(c=>`<div><b>@${c.profiles?.username}:</b> ${c.text}</div>`).join('')}</div>
    </div>`;
  }).join('') || '<p style="text-align:center;padding:40px;color:#aaa">Hakuna video bado. Kuwa wa kwanza kupost!</p>';
}
async function toggleLike(videoId,el){
  let {data} = await supabase.from('likes').select('*').eq('user_id',currentUser.id).eq('video_id',videoId).single();
  if(data) await supabase.from('likes').delete().eq('user_id',currentUser.id).eq('video_id',videoId);
  else await supabase.from('likes').insert({user_id:currentUser.id, video_id:videoId});
  let {data:v} = await supabase.from('videos').select('likes_count').eq('id',videoId).single();
  let newCount = data ? Math.max(0,(v.likes_count||1)-1) : (v.likes_count||0)+1;
  await supabase.from('videos').update({likes_count:newCount}).eq('id',videoId);
  loadFeed();
}
async function followUser(userId,btn){
  if(userId===currentUser.id) return alert('Huwezi kujifollow');
  let {data} = await supabase.from('follows').select('*').eq('follower_id',currentUser.id).eq('following_id',userId).single();
  if(data) await supabase.from('follows').delete().eq('follower_id',currentUser.id).eq('following_id',userId);
  else await supabase.from('follows').insert({follower_id:currentUser.id, following_id:userId});
  loadProfile(); loadFeed();
}
async function addComment(videoId){
  let text = prompt('Andika comment yako:');
  if(!text) return;
  await supabase.from('comments').insert({video_id:videoId, user_id:currentUser.id, text});
  loadFeed();
}
async function shareVideo(videoId){
  let link = location.href.split('#')[0] + '#video-' + videoId;
  if(navigator.share){ await navigator.share({title:'VIBRA - Your Vibe Your World', text:'Angalia hii video VIBRA', url:link}); }
  else { await navigator.clipboard.writeText(link); alert('Link imekopiwa! Tuma WhatsApp / TikTok / Instagram: '+link); }
}
async function postVideo(){
  let url=document.getElementById('videoUrl').value, cap=document.getElementById('caption').value;
  if(!url) return alert('Weka link ya video');
  await supabase.from('videos').insert({user_id:currentUser.id, video_url:url, caption:cap});
  alert('Imepostwa! Dunia nzima inaiona sasa 🌍'); loadFeed();
}
function showFeed(){ document.getElementById('feed').scrollIntoView(); }
function showProfile(){ document.getElementById('profileBox').scrollIntoView(); }
checkUser();
supabase.auth.onAuthStateChange(()=>checkUser());
</script>
</body>
</html>
