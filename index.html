<!DOCTYPE html>
<html lang="sw">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>VIBRA - Your Vibe. Your World.</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Arial,sans-serif}
body{background:#000;color:#fff;overflow:hidden}
#login{height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:20px;text-align:center}
#login h1{font-size:48px;background:linear-gradient(90deg,#ff00aa,#ff8800);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
#login input{width:100%;max-width:320px;padding:14px;margin:8px 0;border-radius:12px;border:1px solid #333;background:#111;color:#fff;font-size:16px}
#login button{width:100%;max-width:320px;padding:14px;border:none;border-radius:12px;font-size:16px;font-weight:bold;cursor:pointer}
.btn-main{background:linear-gradient(90deg,#ff00aa,#ff8800);color:#fff;margin-top:10px}
.btn-google{background:#fff;color:#000}
.langs{display:flex;gap:8px;margin-top:15px;flex-wrap:wrap;justify-content:center}
.langs button{width:auto;padding:8px 12px;border-radius:20px;background:#222;color:#fff;border:1px solid #444;font-size:13px}
#app{display:none;height:100vh;position:relative}
#feed{height:100vh;overflow-y:scroll;scroll-snap-type:y mandatory}
.video{height:100vh;scroll-snap-align:start;position:relative;display:flex;align-items:center;justify-content:center;background:#111}
.video video{width:100%;height:100%;object-fit:cover}
.info{position:absolute;bottom:90px;left:12px;right:70px}
.info b{font-size:18px}
.actions{position:absolute;right:10px;bottom:100px;display:flex;flex-direction:column;gap:16px;text-align:center}
.actions button{background:#222;border:none;color:#fff;width:50px;height:50px;border-radius:50%;font-size:22px;cursor:pointer}
.actions span{font-size:12px;display:block}
.actions button.liked{background:#ff0055}
.nav{position:absolute;bottom:0;left:0;right:0;height:60px;background:#000;display:flex;justify-content:space-around;align-items:center;border-top:1px solid #333;z-index:10}
.nav button{background:none;border:none;color:#fff;font-size:24px;cursor:pointer}
.nav button.active{color:#ff00aa}
#uploadPage,#profilePage{display:none;padding:20px;padding-bottom:80px;overflow-y:auto;height:100vh}
.card{background:#111;padding:15px;border-radius:12px;margin:10px 0}
.commentBox{display:flex;gap:8px;margin-top:10px}
.commentBox input{flex:1;padding:10px;border-radius:8px;border:1px solid #333;background:#222;color:#fff}
</style>
</head>
<body>

<div id="login">
  <div style="font-size:50px">🌍</div>
  <h1>VIBRA</h1>
  <p id="tagline">Your Vibe. Your World. 🌍<br>Create • Share • Vibe</p>
  <br>
  <button class="btn-google" onclick="guestLogin()">G Continue with Google</button>
  <p style="margin:12px;color:#888">OR</p>
  <input id="email" type="email" placeholder="Email" value="test@gmail.com">
  <input id="pass" type="password" placeholder="Password (herufi 4+)" value="1234">
  <button class="btn-main" onclick="doLogin()">Ingia / Jisajili</button>
  <div class="langs">
    <button onclick="setLang('sw')">🇹🇿 Kiswahili</button>
    <button onclick="setLang('en')">🇺🇸 English</button>
    <button onclick="setLang('fr')">🇫🇷 Français</button>
  </div>
  <p id="msg" style="color:#ff5555;margin-top:10px"></p>
</div>

<div id="app">
  <div id="feed"></div>
  <div id="uploadPage">
    <h2>⬆️ Upload Video</h2>
    <div class="card">
      <input type="file" id="fileInput" accept="video/*" style="width:100%;padding:10px">
      <input id="vidTitle" placeholder="Andika jina la video..." style="width:100%;padding:12px;margin-top:10px;border-radius:8px;background:#222;border:1px solid #333;color:#fff">
      <button class="btn-main" style="width:100%;padding:12px;border:none;border-radius:10px;margin-top:10px" onclick="uploadVideo()">Weka Video</button>
      <p id="upMsg" style="margin-top:10px;color:#0f0"></p>
    </div>
    <p>Video zako zitaonekana hapa kwenye Feed.</p>
    <div id="myVideos"></div>
  </div>
  <div id="profilePage">
    <h2>👤 Profile</h2>
    <div class="card">
      <div style="font-size:60px;text-align:center">😎</div>
      <h3 id="profileName" style="text-align:center">test@gmail.com</h3>
      <p style="text-align:center;color:#aaa" id="profileStats">0 Videos • 0 Likes</p>
      <button style="width:100%;padding:12px;margin-top:10px;border-radius:10px;border:none;background:#ff0055;color:#fff" onclick="logout()">Toka / Logout</button>
    </div>
  </div>
  <div class="nav">
    <button id="navHome" class="active" onclick="showPage('feed')">🏠</button>
    <button onclick="showPage('uploadPage')">➕</button>
    <button onclick="showPage('profilePage')">👤</button>
  </div>
</div>

<script>
let videos=[
 {user:"@hamadoski",title:"Karibu VIBRA! 🔥 #vibra",src:"https://interactive-examples.mdn.mozilla.net/media/cc0-videos/flower.mp4",likes:124,comments:["Nzuri sana!","🔥🔥"]},
 {user:"@vibra_official",title:"Vibe mpya kila siku 🌍",src:"https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/BigBuckBunny.mp4",likes:89,comments:["Nimeipenda!"]},
 {user:"@mombasa_vibes",title:"Mombasa vibes 🌊",src:"https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/ForBiggerBlazes.mp4",likes:210,comments:[]}
];
let currentUser="test@gmail.com";
function doLogin(){
  let e=document.getElementById('email').value.trim();
  let p=document.getElementById('pass').value;
  if(!e.includes('@')){document.getElementById('msg').innerText='Weka email sahihi';return;}
  if(p.length<4){document.getElementById('msg').innerText='Password iwe herufi 4 au zaidi';return;}
  currentUser=e;
  enterApp();
}
function guestLogin(){currentUser='guest@vibra.com';enterApp();}
function enterApp(){
  document.getElementById('login').style.display='none';
  document.getElementById('app').style.display='block';
  document.getElementById('profileName').innerText=currentUser;
  renderFeed();
}
function renderFeed(){
  let f=document.getElementById('feed');
  f.innerHTML='';
  videos.forEach((v,i)=>{
    let d=document.createElement('div');d.className='video';
    d.innerHTML='<video src="'+v.src+'" loop muted playsinline onclick="this.paused?this.play():this.pause()"></video>'+
    '<div class="info"><b>'+v.user+'</b><p>'+v.title+'</p><p>❤️ '+v.likes+' • 💬 '+v.comments.length+'</p>'+
    '<div class="commentBox"><input id="c'+i+'" placeholder="Andika comment..."><button onclick="addComment('+i+')" style="padding:10px;border-radius:8px;background:#ff00aa;color:#fff;border:none">Tuma</button></div>'+
    '<div id="clist'+i+'">'+v.comments.map(c=>'<p>• '+c+'</p>').join('')+'</div></div>'+
    '<div class="actions"><button id="like'+i+'" onclick="likeVideo('+i+',this)">❤️</button><span>'+v.likes+'</span><button onclick="shareVideo('+i+')">🔗</button><span>Share</span></div>';
    f.appendChild(d);
  });
  let first=f.querySelector('video');if(first)first.play();
}
function likeVideo(i,btn){videos[i].likes++;btn.classList.add('liked');renderFeed();}
function addComment(i){let inp=document.getElementById('c'+i);if(!inp.value)return;videos[i].comments.push(inp.value);renderFeed();}
function shareVideo(i){alert('Link imekopiwa: vibra.app/video/'+(i+1));}
function showPage(p){
  document.getElementById('feed').style.display=p==='feed'?'block':'none';
  document.getElementById('uploadPage').style.display=p==='uploadPage'?'block':'none';
  document.getElementById('profilePage').style.display=p==='profilePage'?'block':'none';
  document.getElementById('navHome').classList.toggle('active',p==='feed');
}
function uploadVideo(){
  let t=document.getElementById('vidTitle').value||'Video yangu mpya';
  let file=document.getElementById('fileInput').files[0];
  if(!file){document.getElementById('upMsg').innerText='Chagua video kwanza';return;}
  let url=URL.createObjectURL(file);
  videos.unshift({user:'@'+currentUser.split('@')[0],title:t,src:url,likes:0,comments:[]});
  document.getElementById('upMsg').innerText='✅ Video imewekwa! Nenda Home uione.';
  document.getElementById('myVideos').innerHTML+='<div class="card">'+t+'</div>';
  renderFeed();
}
function logout(){location.reload();}
function setLang(l){
  if(l==='sw'){document.getElementById('tagline').innerHTML='Your Vibe. Your World. 🌍<br>Create • Share • Vibe';alert('Lugha: Kiswahili');}
  if(l==='en'){document.getElementById('tagline').innerHTML='Your Vibe. Your World. 🌍<br>Create • Share • Vibe';alert('Language: English');}
  if(l==='fr'){alert('Langue: Français');}
}
</script>
</body>
</html>
