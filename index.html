<!DOCTYPE html>
<html lang="sw">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>VIBRA</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
<style>
  *{ -webkit-tap-highlight-color:transparent; }
  html,body{ margin:0; background:#000; height:100%; overflow:hidden; font-family:system-ui; }
  #feed{ height:100dvh; overflow-y:scroll; scroll-snap-type:y mandatory; scrollbar-width:none; }
  #feed::-webkit-scrollbar{ display:none; }
  .slide{ height:100dvh; scroll-snap-align:start; position:relative; background:#000; }
  .slide video{ width:100%; height:100%; object-fit:cover; }
  .overlay{ position:absolute; inset:0; background:linear-gradient(to top, rgba(0,0,0,.75) 0%, transparent 35%, transparent 70%, rgba(0,0,0,.4) 100%); pointer-events:none; }
  .btn{ pointer-events:auto; }
  #commentsPage{ transform:translateX(100%); transition:.3s; }
  #commentsPage.open{ transform:translateX(0); }
</style>
</head>
<body class="text-white">

<!-- FEED -->
<div id="feed"></div>

<!-- TOP BAR -->
<div class="fixed top-0 left-0 right-0 z-30 flex justify-between items-center px-4 pt-3 pointer-events-none">
  <b class="text-xl tracking-widest">VIBRA<span class="text-pink-500">.</span></b>
  <div class="flex gap-2 pointer-events-auto">
    <button onclick="toggleSound()" id="soundBtn" class="bg-black/60 px-3 py-1.5 rounded-full text-xs">🔇 Sauti: OFF</button>
    <button onclick="openUpload()" class="bg-pink-600 px-4 py-1.5 rounded-full text-xs font-bold">+ Post</button>
  </div>
</div>

<!-- UPLOAD MODAL -->
<div id="uploadModal" class="hidden fixed inset-0 z-50 bg-black/90 p-5 flex flex-col justify-center">
  <h2 class="text-xl font-bold mb-3">Post Video Mpya</h2>
  <input id="capInput" placeholder="Andika caption..." class="bg-zinc-900 p-3 rounded-xl mb-3 outline-none w-full">
  <input type="file" id="fileInput" accept="video/*" class="mb-3">
  <p id="upStatus" class="text-xs text-zinc-400 mb-3"></p>
  <button onclick="uploadVideo()" class="bg-pink-600 py-3 rounded-xl font-bold">Post kwa Watu Wote</button>
  <button onclick="closeUpload()" class="mt-3 text-zinc-400 text-sm">Funga</button>
</div>

<!-- COMMENTS PAGE KAMILI -->
<div id="commentsPage" class="fixed inset-0 z-40 bg-black flex flex-col">
  <div class="flex items-center gap-3 p-4 border-b border-zinc-800">
    <button onclick="closeComments()" class="text-2xl">←</button>
    <b id="commentTitle">Comments</b>
    <span id="commentCount" class="text-zinc-400 text-sm"></span>
  </div>
  <div id="commentList" class="flex-1 overflow-y-auto p-4 space-y-4"></div>
  <div class="p-3 flex gap-2 border-t border-zinc-800">
    <input id="commentInput" placeholder="Andika comment..." class="flex-1 bg-zinc-900 p-3 rounded-full outline-none">
    <button onclick="sendComment()" class="bg-pink-600 px-5 rounded-full font-bold">Tuma</button>
  </div>
</div>

<script>
// ============ BADILISHA HAPA 1: FIREBASE YAKO ============
const firebaseConfig = {
  apiKey: "AIzaSyBAsF_SALFEiraimj1Qg10AiOI8gpixheU",
  authDomain: "vibra-44dce.firebaseapp.com",
  projectId: "vibra-44dce",
  storageBucket: "vibra-44dce.firebasestorage.app",
  messagingSenderId: "424385936523",
  appId: "1:424385936523:web:54c1b5fff7381519e8288e"
};
// ============ BADILISHA HAPA 2: CLOUDINARY ============
const CLOUD_NAME = "s4wd7hxn"; // yako
const UPLOAD_PRESET = "WEKA_PRESET_YAKO_UNSIGNED"; // tengeneza Unsigned preset

firebase.initializeApp(firebaseConfig);
const db = firebase.firestore();
let soundOn = false, currentPostId = null, currentPost = null;

function toggleSound(){
  soundOn = !soundOn;
  document.getElementById('soundBtn').innerText = soundOn ? '🔊 Sauti: ON' : '🔇 Sauti: OFF';
  document.querySelectorAll('video').forEach(v => { v.muted = !soundOn; if(soundOn) v.play().catch(()=>{}); });
}

// ---- LOAD FEED ----
db.collection('posts').orderBy('createdAt','desc').onSnapshot(snap=>{
  const feed = document.getElementById('feed');
  feed.innerHTML = '';
  snap.forEach(doc=>{
    const p = { id: doc.id, ...doc.data() };
    const div = document.createElement('div');
    div.className = 'slide';
    div.innerHTML = `
      <video src="${p.videoUrl}" loop playsinline preload="metadata" muted onclick="this.paused?this.play():this.pause()"></video>
      <div class="overlay"></div>
      <div class="absolute bottom-0 left-0 right-16 p-4 z-10">
        <b>@${p.username||'vibra'}</b>
        <p class="text-sm mt-1">${p.caption||''}</p>
      </div>
      <div class="absolute right-3 bottom-24 flex flex-col gap-4 z-10 items-center">
        <button class="btn bg-black/50 w-12 h-12 rounded-full text-xl" onclick="likePost('${p.id}', ${p.likes||0})">❤️<div class="text-[11px]">${p.likes||0}</div></button>
        <button class="btn bg-black/50 w-12 h-12 rounded-full text-xl" onclick="openComments('${p.id}')">💬</button>
        <button class="btn bg-black/50 w-12 h-12 rounded-full text-xl" onclick="sharePost('${p.id}','${(p.caption||'').replace(/'/g,'')}','${p.videoUrl}')">↗️</button>
      </div>`;
    feed.appendChild(div);
  });
  setupObserver();
});

// ---- AUTOPLAY: video iliyo kwenye screen tu inacheza, nyingine zinazima sauti ----
let observer;
function setupObserver(){
  if(observer) observer.disconnect();
  observer = new IntersectionObserver(entries=>{
    entries.forEach(e=>{
      const v = e.target.querySelector('video');
      if(!v) return;
      if(e.isIntersecting){ v.muted = !soundOn; v.play().catch(()=>{}); }
      else { v.pause(); }
    });
  },{ threshold: 0.7 });
  document.querySelectorAll('.slide').forEach(s=>observer.observe(s));
}

function likePost(id, likes){
  db.collection('posts').doc(id).update({ likes: likes+1 });
}

// ---- SHARE INAFANYA KAZI KWELI ----
async function sharePost(id, caption, videoUrl){
  const url = location.origin + '/?v=' + id;
  const text = caption + ' - Tazama Vibra';
  if(navigator.share){
    try{ await navigator.share({ title:'VIBRA', text, url }); return; }catch(e){}
  }
  try{ await navigator.clipboard.writeText(url); alert('Link imecopy! Tuma WhatsApp sasa: '+url); }
  catch(e){ prompt('Copy link hii:', url); }
}

// ---- COMMENTS PAGE YAKE ----
async function openComments(id){
  currentPostId = id;
  const doc = await db.collection('posts').doc(id).get();
  currentPost = doc.data();
  document.getElementById('commentTitle').innerText = 'Comments - ' + (currentPost.caption||'Video');
  document.getElementById('commentsPage').classList.add('open');
  loadComments();
}
function closeComments(){ document.getElementById('commentsPage').classList.remove('open'); }
async function loadComments(){
  const snap = await db.collection('posts').doc(currentPostId).collection('comments').orderBy('createdAt','asc').get();
  document.getElementById('commentCount').innerText = `(${snap.size})`;
  document.getElementById('commentList').innerHTML = snap.docs.map(d=>`
    <div class="flex gap-2"><div class="w-8 h-8 bg-pink-600 rounded-full flex items-center justify-center font-bold">V</div>
    <div><b class="text-sm">@vibra</b><p class="text-sm">${d.data().text}</p></div></div>`).join('') || '<p class="text-zinc-500 text-center mt-10">Hakuna comment bado. Kuwa wa kwanza!</p>';
}
async function sendComment(){
  const input = document.getElementById('commentInput');
  if(!input.value.trim()) return;
  await db.collection('posts').doc(currentPostId).collection('comments').add({ text: input.value, createdAt: firebase.firestore.FieldValue.serverTimestamp() });
  input.value=''; loadComments();
}

// ---- UPLOAD: CLOUDINARY MOJA KWA MOJA, HAITAKATAA TENA ----
function openUpload(){ document.getElementById('uploadModal').classList.remove('hidden'); }
function closeUpload(){ document.getElementById('uploadModal').classList.add('hidden'); }
async function uploadVideo(){
  const file = document.getElementById('fileInput').files[0];
  const caption = document.getElementById('capInput').value;
  if(!file) return alert('Chagua video kwanza');
  document.getElementById('upStatus').innerText = 'Inapanda... usifunge, ' + (file.size/1024/1024).toFixed(1) + 'MB';
  const fd = new FormData();
  fd.append('file', file);
  fd.append('upload_preset', UPLOAD_PRESET);
  // Cloudinary inahandle video kubwa, sio Firestore
  const res = await fetch(`https://api.cloudinary.com/v1_1/${CLOUD_NAME}/video/upload`, { method:'POST', body: fd });
  const data = await res.json();
  if(!data.secure_url) return alert('Imeshindikana: ' + (data.error?.message||'jaribu tena'));
  await db.collection('posts').add({
    videoUrl: data.secure_url, caption, username:'vibra',
    likes:0, createdAt: firebase.firestore.FieldValue.serverTimestamp()
  });
  document.getElementById('upStatus').innerText = 'Imepost! ✅';
  setTimeout(()=>{ closeUpload(); document.getElementById('feed').scrollTo({top:0}); }, 800);
}
</script>
</body>
</html>
