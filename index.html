<!DOCTYPE html>
<html lang="sw">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Vibra</title>
<script src="https://accounts.google.com/gsi/client" async defer></script>
<script src="https://cdn.tailwindcss.com"></script>
<style>
body{font-family:system-ui;background:#000;color:#fff}
.post{border-bottom:1px solid #222;padding:14px}
.btn{ background:#fff;color:#000;padding:10px 18px;border-radius:999px;font-weight:700;width:100%}
</style>
</head>
<body>

<div id="loginScreen" class="min-h-screen flex flex-col items-center justify-center px-6 text-center">
  <h1 class="text-6xl font-black mb-2">Vibra</h1>
  <p class="text-zinc-400 mb-8">Mahali pa vibes. Post, like, comment, follow.</p>
  <div id="g_id_onload"
    data-client_id="424385936523-kbs9i915j8ooki54pn72qgtvq7e12mpa.apps.googleusercontent.com"
    data-callback="onGoogleLogin"
    data-auto_prompt="false">
  </div>
  <div class="g_id_signin" data-type="standard" data-theme="filled_white" data-size="large" data-text="continue_with" data-shape="pill" data-width="320"></div>
  <p class="text-xs text-zinc-500 mt-6">Kwa kuingia unakubali masharti ya Vibra</p>
</div>

<div id="app" class="hidden max-w-[600px] mx-auto min-h-screen border-x border-zinc-800">
  <div class="sticky top-0 bg-black/80 backdrop-blur p-4 flex justify-between items-center border-b border-zinc-800 z-10">
    <b class="text-2xl">Vibra</b>
    <div class="flex items-center gap-2">
      <img id="userPic" class="w-9 h-9 rounded-full">
      <b id="userName" class="text-sm"></b>
      <button onclick="logout()" class="text-xs bg-zinc-800 px-3 py-1.5 rounded-full">Toka</button>
    </div>
  </div>

  <div class="p-4 border-b border-zinc-800">
    <textarea id="postInput" placeholder="Nini kinaendelea?" class="w-full bg-transparent outline-none text-lg resize-none" rows="2"></textarea>
    <button onclick="addPost()" class="bg-white text-black font-bold px-5 py-2 rounded-full float-right">Post</button>
    <div class="clear-both"></div>
  </div>

  <div id="feed"></div>
</div>

<script>
let user = JSON.parse(localStorage.getItem('vibra_user') || 'null');
let posts = JSON.parse(localStorage.getItem('vibra_posts') || '[]');
if(posts.length===0){
  posts=[
    {name:'Vibra Official', pic:'https://i.pravatar.cc/100?img=12', text:'Karibu Vibra! Post kitu cha kwanza hapa 🔥', likes:124, time:'Sasa'},
    {name:'Hamadi', pic:'https://i.pravatar.cc/100?img=32', text:'Vibra imezinduliwa rasmi! Mko tayari?', likes:89, time:'Dakika 2'}
  ];
}

function onGoogleLogin(res){
  const payload = JSON.parse(atob(res.credential.split('.')[1]));
  user = {name: payload.name, pic: payload.picture, email: payload.email};
  localStorage.setItem('vibra_user', JSON.stringify(user));
  showApp();
}
function showApp(){
  if(!user) return;
  document.getElementById('loginScreen').classList.add('hidden');
  document.getElementById('app').classList.remove('hidden');
  document.getElementById('userName').innerText = user.name;
  document.getElementById('userPic').src = user.pic;
  render();
}
function logout(){ localStorage.removeItem('vibra_user'); location.reload(); }
function addPost(){
  const t = document.getElementById('postInput').value.trim();
  if(!t) return;
  posts.unshift({name:user.name, pic:user.pic, text:t, likes:0, time:'Sasa'});
  localStorage.setItem('vibra_posts', JSON.stringify(posts));
  document.getElementById('postInput').value='';
  render();
}
function like(i){
  posts[i].likes++;
  localStorage.setItem('vibra_posts', JSON.stringify(posts));
  render();
}
function render(){
  document.getElementById('feed').innerHTML = posts.map((p,i)=>`
    <div class="post flex gap-3">
      <img src="${p.pic}" class="w-11 h-11 rounded-full">
      <div class="flex-1">
        <b>${p.name}</b> <span class="text-zinc-500 text-xs">• ${p.time}</span>
        <p class="mt-1">${p.text}</p>
        <button onclick="like(${i})" class="mt-2 text-sm text-zinc-400">❤️ ${p.likes} Like</button>
      </div>
    </div>
  `).join('');
}
if(user) showApp();
</script>
</body>
</html>
