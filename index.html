<!DOCTYPE html>
<html lang="sw">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Vibra</title>
<script src="https://cdn.tailwindcss.com"></script>
<style>
body{font-family:system-ui;background:#000;color:#fff}
.post{border-bottom:1px solid #222;padding:14px}
.btn{ background:#fff;color:#000;padding:10px 18px;border-radius:999px;font-weight:700;width:100%}
</style>
</head>
<body>

<!-- HAKUNA LOGINSCREEN TENA - APP INAFUNGUKA MOJA KWA MOJA -->

<div id="app" class="max-w-[600px] mx-auto min-h-screen border-x border-zinc-800">
  <div class="sticky top-0 bg-black/80 backdrop-blur p-4 flex justify-between items-center border-b border-zinc-800 z-10">
    <b class="text-2xl">Vibra</b>
    <div class="flex items-center gap-2">
      <img id="userPic" class="w-9 h-9 rounded-full">
      <b id="userName" class="text-sm"></b>
      <span class="text-xs bg-white text-black px-3 py-1.5 rounded-full">Guest</span>
    </div>
  </div>

  <div class="p-4 border-b border-zinc-800">
    <textarea id="postInput" placeholder="Nini kinaendelea?" class="w-full bg-transparent outline-none text-lg resize-none" rows="2"></textarea>
    <button onclick="addPost()" class="bg-white text-black font-bold px-5 py-2 rounded-full float-right">Post</button>
    <div class="clear-both"></div>
  </div>

  <div id="feed"></div>

  <!-- BOTTOM NAV -->
  <div class="fixed bottom-0 left-1/2 -translate-x-1/2 w-full max-w-[600px] bg-black border-t border-zinc-800 flex justify-around py-3 text-xs">
    <button>🏠<br>Nyumbani</button>
    <button>🔍<br>Gundua</button>
    <button class="bg-white text-black w-11 h-11 rounded-full text-xl -mt-5">+</button>
    <button>💬<br>Chats</button>
    <button>👤<br>Wasifu</button>
  </div>
  <div class="h-16"></div>
</div>

<script>
// HAKUNA GOOGLE TENA - KILA MTU NI GUEST KIOTOMATIKI
let user = {name: "Mr Vibra", pic: "https://i.pravatar.cc/100?img=12", email: "guest@vibra.co.tz"};
let posts = JSON.parse(localStorage.getItem('vibra_posts') || '[]');
if(posts.length===0){
  posts=[
    {name:'Vibra Official', pic:'https://i.pravatar.cc/100?img=12', text:'Karibu Vibra! Post kitu cha kwanza hapa 🔥', likes:124, time:'Sasa'},
    {name:'Hamadi', pic:'https://i.pravatar.cc/100?img=32', text:'Vibra imezinduliwa rasmi! Mko tayari?', likes:89, time:'Dakika 2'}
  ];
}

function showApp(){
  document.getElementById('userName').innerText = user.name;
  document.getElementById('userPic').src = user.pic;
  render();
}
function addPost(){
  const t = document.getElementById('postInput').value.trim();
  if(!t) return;
  posts.unshift({name:user.name, pic:user.pic, text:t, likes:0, time:'Sasa'});
  localStorage.setItem('vibra_posts', JSON.stringify(posts));
  document.getElementById('postInput').value='';
  render();
}
function like(i){
  posts[i].likes++;
  localStorage.setItem('vibra_posts', JSON.stringify(posts));
  render();
}
function render(){
  document.getElementById('feed').innerHTML = posts.map((p,i)=>`
    <div class="post flex gap-3">
      <img src="${p.pic}" class="w-11 h-11 rounded-full">
      <div class="flex-1">
        <b>${p.name}</b> <span class="text-zinc-500 text-xs">• ${p.time}</span>
        <p class="mt-1">${p.text}</p>
        <button onclick="like(${i})" class="mt-2 text-sm text-zinc-400">❤️ ${p.likes} Like</button>
      </div>
    </div>
  `).join('');
}
showApp();
</script>
</body>
</html>
