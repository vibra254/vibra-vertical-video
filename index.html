<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Vibra</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:system-ui,-apple-system,sans-serif}
body{background:#000;color:#fff;height:100vh;overflow:hidden}
#login{height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:20px;text-align:center}
.logo{font-size:64px;font-weight:900;letter-spacing:-2px}
.logo span{color:#fe2c55}
.sub{color:#aaa;margin:10px 0 30px}
.btn{background:#fe2c55;color:#fff;border:none;padding:15px 25px;border-radius:30px;font-size:16px;font-weight:700;width:100%;max-width:320px;cursor:pointer;margin:8px 0}
.btn2{background:#fff;color:#000}
#app{display:none;height:100vh;flex-direction:column}
header{padding:12px;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid #222}
header b{font-size:22px} header b span{color:#fe2c55}
#feed{flex:1;overflow-y:auto;scroll-snap-type:y mandatory}
.post{height:100%;scroll-snap-align:start;position:relative;background:#111;display:flex;align-items:center;justify-content:center;flex-direction:column;padding:20px}
.post video{max-width:100%;max-height:70vh;border-radius:12px;background:#000}
.post img{max-width:100%;max-height:70vh;border-radius:12px}
.p-title{margin-top:12px;font-weight:700;text-align:center}
.p-user{color:#aaa;font-size:14px}
.actions{position:absolute;right:12px;bottom:100px;display:flex;flex-direction:column;gap:15px}
.act{background:#222;width:48px;height:48px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:20px;cursor:pointer;border:none;color:#fff}
.act.liked{background:#fe2c55}
.bottom{padding:10px;border-top:1px solid #222;display:flex;gap:8px;align-items:center;background:#000}
.bottom input{flex:1;background:#222;border:none;color:#fff;padding:12px;border-radius:20px;outline:none}
.uploadBtn{background:#fe2c55;color:#fff;border:none;width:44px;height:44px;border-radius:50%;font-size:22px;cursor:pointer}
#uploadBox{display:none;padding:12px;border-top:1px solid #222;background:#111}
#uploadBox input,#uploadBox textarea{width:100%;background:#222;border:none;color:#fff;padding:10px;border-radius:10px;margin:5px 0;outline:none}
</style>
</head>
<body>

<div id="login">
  <div class="logo">VIB<span>RA</span></div>
  <p class="sub">Watch. Vibe. Repeat.</p>
  <button class="btn" onclick="loginGoogle()">Continue with Google</button>
  <button class="btn btn2" onclick="loginGuest()">Continue as Guest</button>
  <p style="color:#666;font-size:12px;margin-top:20px">Cloud REAL imeunganishwa</p>
</div>

<div id="app">
  <header><b>VIB<span style="color:#fe2c55">RA</span></b><button onclick="logout()" style="background:#222;color:#fff;border:none;padding:8px 14px;border-radius:20px">Logout</button></header>
  <div id="feed"><p style="padding:20px;text-align:center;color:#aaa">Loading videos...</p></div>
  <div id="uploadBox">
    <input id="vTitle" placeholder="Title ya video...">
    <input id="vUrl" placeholder="Paste video link (mp4) au image link...">
    <input type="file" id="vFile" accept="video/*,image/*">
    <button class="btn" onclick="postVideo()">Post Video</button>
  </div>
  <div class="bottom">
    <input id="quickTitle" placeholder="Andika title...">
    <button class="uploadBtn" onclick="toggleUpload()">+</button>
  </div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getAuth, signInWithPopup, GoogleAuthProvider, signInAnonymously, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import { getFirestore, collection, addDoc, onSnapshot, orderBy, query, serverTimestamp, updateDoc, doc, increment } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

// ===== WEKA HAPA FIREBASE CONFIG YAKO KUTOKA FIREBASE > PROJECT SETTINGS =====
  const firebaseConfig = {
  apiKey: "AIzaSyBAsF_SALFEiraimj1Qg10AiOI8gpixheU",
  authDomain: "vibra-44dce.firebaseapp.com",
  projectId: "vibra-44dce",
  storageBucket: "vibra-44dce.firebasestorage.app",
  messagingSenderId: "424385936523",
  appId: "1:424385936523:web:54c1b5fff7381519e8288e"
};
// ===============================================================================

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);
const provider = new GoogleAuthProvider();
let currentUser = null;

window.loginGoogle = async () => {
  try { await signInWithPopup(auth, provider); }
  catch(e){ alert("Google error: " + e.message + "\n\nHakikisha domain hii iko Firebase > Authentication > Authorized domains:\n" + location.hostname); }
};
window.loginGuest = async () => { try{ await signInAnonymously(auth); }catch(e){ alert(e.message); } };
window.logout = async () => { await signOut(auth); location.reload(); };
window.toggleUpload = () => {
  const b = document.getElementById('uploadBox');
  b.style.display = b.style.display === 'block' ? 'none' : 'block';
};

onAuthStateChanged(auth, (u) => {
  currentUser = u;
  if(u){
    document.getElementById('login').style.display = 'none';
    document.getElementById('app').style.display = 'flex';
    loadVideos();
  } else {
    document.getElementById('login').style.display = 'flex';
    document.getElementById('app').style.display = 'none';
  }
});

function loadVideos(){
  const q = query(collection(db, "videos"), orderBy("createdAt", "desc"));
  onSnapshot(q, (snap) => {
    const feed = document.getElementById('feed');
    if(snap.empty){ feed.innerHTML = '<p style="padding:30px;text-align:center;color:#aaa">Hakuna video bado.<br>Kuwa wa kwanza ku-post!</p>'; return; }
    feed.innerHTML = '';
    snap.forEach(d => {
      const v = d.data();
      const div = document.createElement('div');
      div.className = 'post';
      const isVideo = (v.videoUrl || '').match(/\.(mp4|webm|mov)/i) || (v.type === 'video');
      let media = '';
      if(v.videoUrl){
        if(isVideo) media = `<video src="${v.videoUrl}" controls loop playsinline></video>`;
        else media = `<img src="${v.videoUrl}">`;
      } else media = `<div style="font-size:60px">🎬</div>`;
      div.innerHTML = media + `<div class="p-title">${v.title || 'Untitled'}</div><div class="p-user">@${v.user || 'user'}</div>
      <div class="actions">
        <button class="act" onclick="likeVideo('${d.id}', this)">❤️<br><span style="font-size:11px">${v.likes || 0}</span></button>
        <button class="act" onclick="shareVideo('${v.videoUrl || ''}')">↗️</button>
      </div>`;
      feed.appendChild(div);
    });
  });
}

window.likeVideo = async (id, el) => {
  try{ await updateDoc(doc(db, "videos", id), { likes: increment(1) }); el.classList.add('liked'); }catch(e){ alert(e.message); }
};
window.shareVideo = async (url) => {
  try{ await navigator.clipboard.writeText(location.href); alert("Link copied!"); }catch(e){ alert("Share: " + location.href); }
};

window.postVideo = async () => {
  const title = document.getElementById('vTitle').value || document.getElementById('quickTitle').value || 'My Vibra Video';
  let url = document.getElementById('vUrl').value.trim();
  const file = document.getElementById('vFile').files[0];
  if(file && !url){
    // File kubwa haiwezi kwenda Firestore, tunatumia local preview + tunahifadhi kama data URL kama ni ndogo
    // Kwa REAL kubwa, tumia link ya Cloudinary / Firebase Storage baadaye
    alert("Kwa sasa weka link ya video (mp4) ili kila mtu aione. File upload ya moja kwa moja inakuja next update.");
    return;
  }
  if(!url){ alert("Weka link ya video kwanza"); return; }
  try{
    await addDoc(collection(db, "videos"), {
      title: title,
      videoUrl: url,
      user: currentUser?.displayName || currentUser?.email?.split('@')[0] || 'guest',
      userId: currentUser?.uid || 'guest',
      likes: 0,
      type: url.match(/\.(mp4|webm|mov)/i) ? 'video' : 'image',
      createdAt: serverTimestamp()
    });
    document.getElementById('vTitle').value=''; document.getElementById('vUrl').value='';
    document.getElementById('uploadBox').style.display='none';
    alert("Posted! ✅");
  }catch(e){ alert("Post error: " + e.message); }
};
</script>
</body>
</html>
